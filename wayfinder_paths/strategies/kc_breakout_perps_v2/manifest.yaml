schema_version: "0.1"
status: stable
entrypoint: "wayfinder_paths.strategies.kc_breakout_perps_v2.strategy.KcBreakoutPerpsV2Strategy"

adapters:
  - name: hyperliquid
    capabilities:
      - perp_trading
      - order_management

description: |
  KC-Breakout Perps v2 — high-conviction variant (long-only, HYPE + ZEC).

  Same engine as kc_breakout_perps with two validated parameter changes:
    kc_multiplier 1.7536 -> 2.0  (wider Keltner band: fewer, higher-conviction
                                  breakouts)
    reward_factor 2.59   -> 3.0  (larger take-profit multiple: let winners run)
  The pair, not either alone, is what produced a robust, both-token,
  out-of-sample-validated improvement.

  Entry: price closes above the upper Keltner Channel (EMA10 ± 2.0·ATR27), gated
  by a low-Ulcer-Index risk filter (UI39 < 6.1425) AND an EMA-100-rising trend
  regime filter. Exit: dynamic ATR(14)×2.0 stop-loss / 3.0× reward take-profit,
  detected on the completed bar and filled at the next bar's open; 1000-bar max
  hold. Sizing: risk-based (3.97% of NAV/trade), capped at 5x leverage. 24h
  cooldown.

  Authoritative backtest = the event-driven engine in strategy_engine.py (true
  ATR from high/low + next-open fills). The framework's close-only target-weight
  backtest is an approximation only — see README.

  Walk-forward validated vs v1 (HYPE+ZEC 1h, held-out final ~30%):
    FULL Sharpe 2.85 -> 4.33, FULL return +65.7% -> +109.4%, fold-Sharpe
    dispersion 1.69 -> 0.45, HOLDOUT Sharpe 4.64 -> 7.50; per-sleeve both up
    (HYPE 3.55 / ZEC 3.02).

  Caveats: kc_multiplier=2.0 is near a cliff (>=2.05 collapses); 1.95 is the
  conservative alternative. Single ~208-day cycle — forward-validate before live.

  Universe: HYPE, ZEC. Per-position notional > $10 HL minimum at NAV ≥ ~$50.

parameters:
  symbols: ["HYPE", "ZEC"]
  kc_window: 10
  kc_window_atr: 27
  kc_multiplier: 2.0
  ulcer_window: 39
  ulcer_threshold: 6.1425
  trend_filter: "ema_above_rising"
  trend_window: 100
  trend_slope_lookback: 24
  atr_period: 14
  atr_volatility_factor: 2.0
  reward_factor: 3.0
  max_risk_per_trade: 0.0397
  cooldown_bars: 24
  max_hold_bars: 1000
  exit_execution: "next_open"
  max_leverage: 5.0
  max_gross_leverage: 5.0
  rebalance_threshold: 0.05
  min_order_usd: 10.0
  fee_bps: 9.5
  slippage_bps: 5.0
  signal_lookback_bars: 1200

risk_limits:
  max_drawdown: -0.25
  max_position_per_symbol_usd: 1000
  max_gross_exposure_usd: 2000
