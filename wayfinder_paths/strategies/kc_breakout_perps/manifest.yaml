schema_version: "0.1"
status: stable
entrypoint: "wayfinder_paths.strategies.kc_breakout_perps.strategy.KcBreakoutPerpsStrategy"

adapters:
  - name: hyperliquid
    capabilities:
      - perp_trading
      - order_management

description: |
  Keltner-breakout momentum on Hyperliquid perps (long-only, HYPE + ZEC).

  Entry: price closes above the upper Keltner Channel (EMA10 ± 1.7536·ATR27),
  gated by a low-Ulcer-Index risk filter (UI39 < 6.1425) AND an EMA-100-rising
  trend regime filter (only long when price > EMA100 and EMA100 is rising — this
  filter keeps the strategy out of chop and makes it robust across both the
  trending and ranging halves of the backtest).
  Exit: dynamic ATR(14)×2.0 stop-loss / 2.59× reward take-profit, detected on the
  completed bar and filled at the next bar's open; 1000-bar max hold.
  Sizing: risk-based (3.97% of NAV risked per trade), capped at 5x leverage
  (actual usage ~1–3.5x). 24h cooldown after each trade.

  Indicators reproduce the Mangrove KB definitions 1:1 (numerically validated).
  Authoritative backtest = the event-driven engine in strategy_engine.py (true
  ATR from high/low + next-open fills). The framework's close-only target-weight
  backtest is an approximation only — see README.

  Backtest: 208d HL data, fee 9.5bps (HL taker 4.5 + Wayfinder builder 5.0) +
  per-token slippage (HYPE 4bp / ZEC 5bp, live L2-book measured), next-open
  exits, with funding. 50/50 two-sleeve portfolio:
    - 208d: Sharpe 2.85, return +65.7%, maxDD -8.2%, 43 trades
    - per-sleeve: HYPE +59.7% (Sh 2.20), ZEC +71.7% (Sh 2.16)

  Caveats: single ~208-day cycle (no multi-fold walk-forward yet); naive
  per-token param re-tuning was shown to overfit, so params are the original
  Mangrove values plus the added trend filter (consistent across both tokens).

  Universe: HYPE, ZEC. Per-position notional > $10 HL minimum at NAV ≥ ~$50.

parameters:
  symbols: ["HYPE", "ZEC"]
  kc_window: 10
  kc_window_atr: 27
  kc_multiplier: 1.7536
  ulcer_window: 39
  ulcer_threshold: 6.1425
  trend_filter: "ema_above_rising"
  trend_window: 100
  trend_slope_lookback: 24
  atr_period: 14
  atr_volatility_factor: 2.0
  reward_factor: 2.59
  max_risk_per_trade: 0.0397
  cooldown_bars: 24
  max_hold_bars: 1000
  exit_execution: "next_open"
  max_leverage: 5.0
  max_gross_leverage: 5.0
  rebalance_threshold: 0.05
  min_order_usd: 10.0
  fee_bps: 9.5
  slippage_bps: 5.0
  signal_lookback_bars: 1200

risk_limits:
  max_drawdown: -0.25
  max_position_per_symbol_usd: 1000
  max_gross_exposure_usd: 2000
